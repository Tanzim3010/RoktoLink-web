<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/style.css">
    <title>Rokto Link - Blood Donation</title>
</head>

<body>

    <div class="container" id="signupForm" style="display: none;">
        <h1>Register</h1>
        <!-- Updated Form Tag -->
        <form action="../php/auth.php" method="POST">
            <!-- Hidden action identifier -->
            <input type="hidden" name="action" value="register">

            <label>First Name</label>
            <input type="text" id="signupName" name="name" placeholder="Enter Name" required>
            <small id="nameError"></small>

            <label>Email :</label>
            <input type="email" id="signupEmail" name="email" placeholder="Enter Email" required>
            <small id="emailError"></small>

            <label>NID :</label>
            <input type="number" id="nid" name="nid" placeholder="Enter NID Number (10 digits)" min="1000000000" max="9999999999" required>
            <small id="nidError"></small>

            <label>Password :</label>
            <input type="password" id="signupPass" name="password" placeholder="Enter Password" required>
            <small id="passError"></small>

            <input type="submit" value="Sign Up" id="registerButton">

            <div class="switch">
                <span style="color: aliceblue;">Already have an account?</span>
                <input type="button" value="Login" id="signIn">
            </div>
        </form>
    </div>

    <div class="container" id="signinForm">
        <h1>Login</h1>
        <!-- Updated Form Tag -->
        <form action="../php/auth.php" method="POST">
            <!-- Hidden action identifier -->
            <input type="hidden" name="action" value="login">

            <label>Email :</label>
            <input type="email" id="signinEmail" name="email" placeholder="Enter Email" required>
            <small id="inputName"></small>

            <label>Password :</label>
            <input type="password" id="signinPass" name="password" placeholder="Enter Password" required>
            <small id="inputPass"></small>

            <input type="submit" value="Sign In" id="Login_button">

            <div class="switch">
                <span style="color: aliceblue;">Don't have an account?</span>
                <input type="button" value="Sign Up" id="signUP">
            </div>
        </form>
    </div>

    <script src="../javascript/script.js"></script>
</body>

</html>
